name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform (Flutter 3.47+ Gradle template)
        working-directory: ./mobile
        run: |
          rm -rf android _flutter_scaffold
          flutter create _flutter_scaffold \
            --org com.spendwise \
            --platforms=android \
            --project-name mobile
          cp -r _flutter_scaffold/android .
          rm -rf _flutter_scaffold
          bash scripts/patch-android-after-create.sh
          test -f android/settings.gradle.kts
          echo "Android scaffold ready ($(grep -E 'com.android.application|dev.flutter.flutter-plugin-loader' android/settings.gradle.kts))"

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze
        working-directory: ./mobile
        run: flutter analyze

      - name: Test
        working-directory: ./mobile
        run: flutter test

      - name: Decode keystore
        working-directory: ./mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Release keystore decoded successfully."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set."
            echo "Add repository secrets, then re-run this workflow to print the release SHA-1."
          fi

      - name: Print release SHA-1 (for Google OAuth)
        working-directory: ./mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -f android/app/release.keystore ]; then
            echo "=== SHA-1 not available ==="
            echo "Set these GitHub repository secrets, then re-run:"
            echo "  ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 0
          fi
          if [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEY_ALIAS and KEYSTORE_PASSWORD secrets are required."
            exit 1
          fi
          echo "=== Keystore SHA-1 (should match built APK after release signing) ==="
          KEYTOOL_OUT="$(keytool -list -v -keystore android/app/release.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>&1)"
          echo "$KEYTOOL_OUT"
          if ! echo "$KEYTOOL_OUT" | grep -qiE "SHA-?1"; then
            echo "::error::Could not read SHA-1 from release keystore."
            exit 1
          fi
          echo "=== End keystore SHA-1 ==="

      - name: Configure release signing
        working-directory: ./mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f android/app/release.keystore ]; then
            bash scripts/configure-android-signing.sh
            echo "Release signing configured."
          else
            echo "::warning::No release keystore — APK will be debug-signed."
            echo "Google Sign-In error 10 will occur unless debug SHA-1 is registered in Google Cloud."
          fi

      - name: Prepare mobile/.env
        working-directory: ./mobile
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          # Prefer committed mobile/.env so repo is source of truth (secrets override only if no .env).
          if [ -f .env ] && grep -q '^GOOGLE_WEB_CLIENT_ID=' .env; then
            CLIENT_KEY="$(grep '^GOOGLE_WEB_CLIENT_ID=' .env | cut -d= -f2 | cut -d- -f2 | cut -d. -f1)"
            echo "Using mobile/.env from checkout (Web client key starts with: ${CLIENT_KEY:0:5}…)."
          elif [ -n "$MOBILE_ENV" ]; then
            printf '%s\n' "$MOBILE_ENV" > .env
            echo "Wrote mobile/.env from MOBILE_ENV secret."
          elif [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID" > .env
            echo "Wrote mobile/.env from GOOGLE_WEB_CLIENT_ID secret."
          else
            echo "::warning::No mobile/.env and no MOBILE_ENV / GOOGLE_WEB_CLIENT_ID secret."
            echo "Copy mobile/.env.example to mobile/.env or add GOOGLE_WEB_CLIENT_ID GitHub secret."
          fi

      - name: Build APK
        working-directory: ./mobile
        run: |
          DART_DEFINES=$(bash scripts/load-dart-defines.sh)
          if [ -n "$DART_DEFINES" ]; then
            CLIENT_KEY="$(grep '^GOOGLE_WEB_CLIENT_ID=' .env | cut -d= -f2 | cut -d- -f2 | cut -d. -f1)"
            echo "GOOGLE_WEB_CLIENT_ID is set (key starts with: ${CLIENT_KEY:0:5}…)."
            echo "Expected Web client key prefix: 8m1kv"
          else
            echo "::warning::GOOGLE_WEB_CLIENT_ID is not set."
            echo "Add GOOGLE_WEB_CLIENT_ID to mobile/.env or GitHub Actions secrets."
          fi
          flutter build apk --release $DART_DEFINES

      - name: Print APK signing SHA-1 (verify Google OAuth)
        working-directory: ./mobile
        run: bash scripts/print-apk-sha1.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spendwise-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
