name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform (Flutter 3.47+ Gradle template)
        working-directory: ./mobile
        run: |
          rm -rf android _flutter_scaffold
          flutter create _flutter_scaffold \
            --org com.spendwise \
            --platforms=android \
            --project-name spendwise_mobile
          cp -r _flutter_scaffold/android .
          rm -rf _flutter_scaffold
          test -f android/settings.gradle.kts
          echo "Android scaffold ready ($(grep -E 'com.android.application|dev.flutter.flutter-plugin-loader' android/settings.gradle.kts))"

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze
        working-directory: ./mobile
        run: flutter analyze

      - name: Test
        working-directory: ./mobile
        run: flutter test

      - name: Decode keystore
        working-directory: ./mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Release keystore decoded successfully."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set."
            echo "Add repository secrets, then re-run this workflow to print the release SHA-1."
          fi

      - name: Print release SHA-1 (for Google OAuth)
        working-directory: ./mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -f android/app/release.keystore ]; then
            echo "=== SHA-1 not available ==="
            echo "Set these GitHub repository secrets, then re-run:"
            echo "  ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 0
          fi
          if [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEY_ALIAS and KEYSTORE_PASSWORD secrets are required."
            exit 1
          fi
          echo "=== Copy this SHA-1 into Google Auth Platform > Clients > Android ==="
          keytool -list -v -keystore android/app/release.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA-1:"
          echo "=== End SHA-1 ==="

      - name: Configure release signing
        working-directory: ./mobile
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f android/app/release.keystore ]; then
            bash scripts/configure-android-signing.sh
          fi

      - name: Build APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spendwise-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
