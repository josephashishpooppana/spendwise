name: Android Keystore Setup

# One-time setup: generates a release keystore in CI, prints SHA-1 + base64 for GitHub secrets.
# No local Android/Java setup required.

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore password (pick one and remember it)'
        required: true
        type: string
      key_alias:
        description: 'Key alias'
        required: true
        default: 'upload'
      key_password:
        description: 'Key password (can match keystore password)'
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate release keystore
        run: |
          mkdir -p mobile/android/app
          keytool -genkey -v \
            -keystore mobile/android/app/release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.keystore_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=SpendWise, OU=Mobile, O=SpendWise, L=Unknown, ST=Unknown, C=US"

      - name: Print SHA-1 for Google OAuth
        run: |
          echo "=== Copy this SHA-1 into Google Auth Platform > Clients > Android ==="
          keytool -list -v -keystore mobile/android/app/release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -storepass "${{ inputs.keystore_password }}" | grep -E "SHA1:|SHA-1:"
          echo "=== End SHA-1 ==="

      - name: Print base64 for ANDROID_KEYSTORE_BASE64
        run: |
          echo "=== Copy the next line as ANDROID_KEYSTORE_BASE64 repository secret ==="
          base64 -w 0 mobile/android/app/release.keystore
          echo ""
          echo "=== End base64 ==="

      - name: Setup summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Android keystore created

          Add these **GitHub repository secrets** (Settings → Secrets → Actions):

          | Secret | Value |
          |---|---|
          | \`ANDROID_KEYSTORE_BASE64\` | The long base64 string from the step above |
          | \`KEYSTORE_PASSWORD\` | \`${{ inputs.keystore_password }}\` |
          | \`KEY_ALIAS\` | \`${{ inputs.key_alias }}\` |
          | \`KEY_PASSWORD\` | \`${{ inputs.key_password }}\` |

          Then:
          1. Copy **SHA-1** from **Print SHA-1 for Google OAuth** into Google Cloud Console
          2. Run **Build APK** workflow to build the signed app
          EOF

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: mobile/android/app/release.keystore
          retention-days: 30
